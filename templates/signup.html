{% extends "base.html" %}

{% block content %}
<div class="flex-grow flex items-center justify-center p-4 py-16 relative overflow-hidden bg-[#0A0A0B]">

    <!-- Offset radial glow -->
    <div class="absolute inset-0 pointer-events-none" aria-hidden="true"
         style="background: radial-gradient(ellipse 700px 500px at 75% 50%, rgba(255,107,53,0.08) 0%, transparent 65%);"></div>

    <!-- Auth Card -->
    <div class="bg-[#141416] border border-white/[.08] rounded-2xl p-8 w-full max-w-md fade-in relative z-10">

        <!-- Header -->
        <div class="text-center mb-8">
            <img src="/static/skillsync-logo.png" alt="SkillSync Logo"
                 class="w-12 h-12 rounded-xl object-contain mx-auto mb-4"
                 style="filter: drop-shadow(0 0 8px rgba(255,107,53,0.35));">
            <h2 class="text-2xl font-bold text-white tracking-tight">Create an account</h2>
            <p class="text-ink-secondary mt-2 text-sm">Join to analyze your resume or post jobs</p>
        </div>

        <!-- Error -->
        {% if error %}
        <div class="bg-red-950/50 text-red-400 p-3 rounded-xl text-sm mb-6 border border-red-800/40 text-center">
            {{ error }}
        </div>
        {% endif %}

        <!-- Signup Form — action/method UNCHANGED -->
        <form action="/auth/signup" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide">Full Name</label>
                <input type="text" name="name" required
                       class="w-full px-4 py-3 bg-[#1C1C1F] text-white border border-white/[.08] rounded-xl text-sm placeholder-ink-muted transition-all"
                       placeholder="Jane Smith">
            </div>
            <div>
                <label class="block text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide">Email</label>
                <input type="email" name="email" required
                       class="w-full px-4 py-3 bg-[#1C1C1F] text-white border border-white/[.08] rounded-xl text-sm placeholder-ink-muted transition-all"
                       placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide">Password</label>
                <input type="password" name="password" required minlength="6"
                       class="w-full px-4 py-3 bg-[#1C1C1F] text-white border border-white/[.08] rounded-xl text-sm placeholder-ink-muted transition-all"
                       placeholder="Min. 6 characters">
            </div>
            <div>
                <label class="block text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide">Account Type</label>
                <select name="role" required
                        class="w-full px-4 py-3 bg-[#1C1C1F] text-white border border-white/[.08] rounded-xl text-sm transition-all appearance-none cursor-pointer">
                    <option value="student">Student / Applicant</option>
                    <option value="admin">Administrator / Recruiter</option>
                </select>
            </div>
            <button type="submit" class="btn-primary w-full py-3 rounded-xl text-sm mt-2">
                Create Account
            </button>
        </form>

        <!-- Divider -->
        <div class="my-6 relative">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-white/[.06]"></div>
            </div>
            <div class="relative flex justify-center">
                <span class="px-3 bg-[#141416] text-xs text-ink-muted">Or continue with</span>
            </div>
        </div>

        <!-- Google OAuth — href UNCHANGED -->
        <a href="/auth/google"
           class="w-full flex items-center justify-center gap-3 py-3 px-4 bg-[#1C1C1F] border border-white/[.08] rounded-xl text-sm font-medium text-ink-secondary hover:text-white hover:border-white/[.16] transition-all">
            <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign up with Google
        </a>

        <!-- Footer link -->
        <p class="text-center text-sm text-ink-muted mt-6">
            Already have an account?
            <a href="/login" class="text-brand-400 font-medium hover:text-brand-300 transition-colors ml-1">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
