{% for job in jobs %}
<div class="bg-[#141416] border border-white/[.08] rounded-2xl p-5 card-hover fade-up">

    <!-- Job header -->
    <div class="flex justify-between items-start mb-3 gap-3">
        <h3 class="text-base font-bold text-white leading-tight">{{ job.title }}</h3>
        <span class="flex-shrink-0 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-green-950/50 border border-green-800/30 text-green-400">
            <div class="w-1.5 h-1.5 rounded-full bg-green-400"></div>
            {{ job.match_percent }}% Match
        </span>
    </div>

    <!-- Meta info -->
    <div class="flex flex-wrap gap-3 mb-4 text-xs text-ink-muted">
        {% if job.location %}
        <span class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            {{ job.location }}
        </span>
        {% endif %}
        {% if job.salary %}
        <span class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            ${{ "{:,.0f}".format(job.salary) }}
        </span>
        {% endif %}
    </div>

    <!-- Skill chips -->
    <div class="flex flex-wrap gap-1.5 mb-5">
        {% for skill in job.required_skills %}
        <span class="px-2.5 py-1 bg-[#1C1C1F] border border-white/[.06] text-ink-secondary text-xs rounded-lg font-medium">{{ skill }}</span>
        {% endfor %}
    </div>

    <!-- Apply Button — all HTMX attrs UNCHANGED -->
    <div id="apply-btn-{{ job.id }}">
        <button hx-post="/api/jobs/{{ job.id }}/apply"
                hx-target="#apply-btn-{{ job.id }}"
                class="w-full border border-brand-500/30 text-brand-400 font-medium py-2.5 rounded-xl text-sm hover:bg-brand-900/20 hover:border-brand-500/60 transition-all">
            Apply Now
        </button>
    </div>
</div>
{% endfor %}
