<tr id="app-row-{{ app.id }}" class="fade-in hover:bg-white/[.02] transition-colors">
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="text-sm font-medium text-white">{{ app.students.name if app.students else 'Unknown' }}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="text-sm text-ink-secondary">{{ app.jobs.title if app.jobs else 'Unknown Role' }}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-ink-muted">
        {{ app.applied_at[:10] if app.applied_at else '' }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
        <!-- Status form — all HTMX attrs and onchange UNCHANGED -->
        <form hx-post="/api/applications/{{ app.id }}/status"
              hx-target="#app-row-{{ app.id }}"
              hx-swap="outerHTML"
              class="inline-flex items-center">
            <select name="status" onchange="this.form.requestSubmit()"
                class="text-xs rounded-full px-3 py-1.5 border-0 ring-1 ring-inset outline-none cursor-pointer transition-all bg-[#1C1C1F]
                {% if app.status == 'Selected' %} text-green-400 ring-green-800/60
                {% elif app.status == 'Rejected' %} text-red-400 ring-red-800/60
                {% else %} text-amber-400 ring-amber-800/60 {% endif %}">
                <option value="Applied" {% if app.status == 'Applied' %}selected{% endif %}>Applied</option>
                <option value="Selected" {% if app.status == 'Selected' %}selected{% endif %}>Selected</option>
                <option value="Rejected" {% if app.status == 'Rejected' %}selected{% endif %}>Rejected</option>
            </select>
        </form>
    </td>
</tr>
