{% extends "base.html" %}

{% block content %}
<div class="flex-grow flex items-center justify-center p-4 py-16 relative overflow-hidden bg-[#0A0A0B]">
    
    <!-- Radial glow -->
    <div class="absolute inset-0 pointer-events-none" aria-hidden="true"
         style="background: radial-gradient(ellipse 700px 500px at 50% 50%, rgba(255,107,53,0.07) 0%, transparent 65%);"></div>

    <div class="w-full max-w-lg relative z-10">
        <div class="bg-[#141416] border border-white/[.08] rounded-2xl p-8 fade-in shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 rounded-xl flex items-center justify-center mx-auto mb-4"
                     style="background: linear-gradient(135deg, #FF6B35, #FF3D00);">
                    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1v1H9V7zm5 0h1v1h-1V7zm-5 4h1v1H9v-1zm5 0h1v1h-1v-1zm-5 4h1v1H9v-1zm5 0h1v1h-1v-1z" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-white tracking-tight">Complete Your Profile</h2>
                <p class="text-ink-secondary mt-2 text-sm">Tell us about your company to get started.</p>
            </div>

            {% if error %}
            <div class="bg-red-950/50 text-red-400 p-3 rounded-xl text-sm mb-6 border border-red-800/40 text-center">
                {{ error }}
            </div>
            {% endif %}

            <form action="/api/recruiter/onboard" method="POST" class="space-y-5">
                <!-- Company Section -->
                <div class="space-y-4">
                    <h3 class="text-sm font-semibold text-white uppercase tracking-wider border-b border-white/[.08] pb-2">Company Details</h3>
                    <div>
                        <label class="block text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide">Company Name *</label>
                        <input type="text" name="company_name" required
                               class="w-full px-4 py-3 bg-[#1C1C1F] text-white border border-white/[.08] rounded-xl text-sm placeholder-ink-muted transition-all"
                               placeholder="e.g. TechCorp Inc.">
                    </div>
                </div>

                <!-- Optional Job Section -->
                <div class="space-y-4 pt-4">
                    <h3 class="text-sm font-semibold text-white uppercase tracking-wider border-b border-white/[.08] pb-2">First Job Posting (Optional)</h3>
                    <div>
                        <label class="block text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide">Job Title</label>
                        <input type="text" name="job_title"
                               class="w-full px-4 py-3 bg-[#1C1C1F] text-white border border-white/[.08] rounded-xl text-sm placeholder-ink-muted transition-all"
                               placeholder="e.g. Senior Software Engineer">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide">Location</label>
                            <input type="text" name="job_location"
                                   class="w-full px-4 py-3 bg-[#1C1C1F] text-white border border-white/[.08] rounded-xl text-sm placeholder-ink-muted transition-all"
                                   placeholder="e.g. Remote, New York">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide">Salary ($)</label>
                            <input type="number" name="job_salary"
                                   class="w-full px-4 py-3 bg-[#1C1C1F] text-white border border-white/[.08] rounded-xl text-sm placeholder-ink-muted transition-all"
                                   placeholder="e.g. 120000">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide">Description</label>
                        <textarea name="job_description" rows="3"
                                  class="w-full px-4 py-3 bg-[#1C1C1F] text-white border border-white/[.08] rounded-xl text-sm placeholder-ink-muted transition-all resize-none"
                                  placeholder="Briefly describe the role..."></textarea>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="btn-primary w-full py-3 rounded-xl text-sm mt-2">
                        Complete Setup & Go to Dashboard
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
